# WVmp protection config - wvmpTest kernels target (MIT-379).
#
# Usage: wvmp_cli.exe protect --config <this file path>
# Schema: see cli/include/wvmp/cli/config.hpp; pass order follows default.toml
# (Pipeline by Phase: Load -> Analyze -> Transform -> Emit -> Write).
#
# Paths are relative to the process working directory, NOT to this file.
# smoke_test.bat pushes the WVmp repo root before invoking wvmp_cli.exe, so
# the two paths below resolve inside this repo's tests/wvmpTest/build tree
# (MIT-492 corpus in-repo: no external sibling clone is read or written).

input  = "tests/wvmpTest/build/x64/test_target.exe"
output = "tests/wvmpTest/build/x64/packed.exe"
seed   = 12345

[[passes]]
name = "pe_loader"
[[passes]]
name = "marker_scan"
[[passes]]
name = "lifter"
[[passes]]
name = "virtualize"
[[passes]]
name = "stub_link"
[[passes]]
name = "pe_writer"
