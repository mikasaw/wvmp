# MIT-350: cmd.exe 现实世界 exe 回归测试集 (Windows 自带 shell)
#
# 类别: 命令行 shell (Windows 自带)
# 验证目标: shell 命令 + 大量 string 处理 + Win32 console API
# 预期: 大概率走 C1 gate 兜底 (派活单限定不支持: syscall/console API thunk)
#       verify_real_world.sh 会捕获 protect 失败或 byte-exact 差异作为 pitfall 实证.
#
# 用法: wvmp_cli.exe protect --config scripts/real_world_exe/cmd.toml
# 输出: ./build/real_world_exe/cmd.protected.exe
input  = "C:/Windows/System32/cmd.exe"
output = "./build/real_world_exe/cmd.protected.exe"
seed   = 12345

[[passes]]
name = "pe_loader"
[[passes]]
name = "marker_scan"
[[passes]]
name = "lifter"
[[passes]]
name = "virtualize"
[[passes]]
name = "stub_link"
[[passes]]
name = "pe_writer"